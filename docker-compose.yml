services:
  caddy:
    # On the VM, `docker compose pull` fetches this prebuilt image (built in CI).
    # Locally, `docker compose up --build` still builds from the Dockerfile and
    # tags the result with this name. Override the owner via IMAGE if you fork.
    image: ${IMAGE:-ghcr.io/shellisj/blobfront:latest}
    build: .
    container_name: blobfront
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config.yaml:/etc/blobfront/config.yaml:ro
      - caddy_data:/data       # TLS certificates
      - caddy_config:/config   # Caddy runtime config
      - caddy_logs:/var/log/caddy
    environment:
      - CONFIG_PATH=/etc/blobfront/config.yaml

volumes:
  caddy_data:
  caddy_config:
  caddy_logs:
