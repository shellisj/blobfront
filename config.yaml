# BlobFront Configuration
# Maps custom domains to Azure Blob Storage static website endpoints.

global:
  # Email for Let's Encrypt certificate notifications
  email: you@example.com

  # Default cache TTLs applied to any site that doesn't set its own.
  # NOTE: the cache-handler plugin's default store is bounded by entry count,
  # not bytes, so there is intentionally no "max size in MB" knob here.
  cache_ttl: 3600        # 1 hour
  cache_stale: 86400     # Serve stale for 24h if backend is down

sites:
  # Example: Main website
  - domain: example.com
    backend: https://myaccount.z6.web.core.windows.net
    cache_ttl: 3600        # 1 hour
    cache_stale: 86400     # Serve stale for 24h if backend down
    redirect_www: true
    headers:
      X-Frame-Options: DENY
      X-Content-Type-Options: nosniff
      Referrer-Policy: strict-origin-when-cross-origin

  # Example: Blog on a different storage account
  # - domain: blog.example.com
  #   backend: https://myblogaccount.z6.web.core.windows.net
  #   cache_ttl: 7200
  #   cache_stale: 43200
