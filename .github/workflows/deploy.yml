# CI/CD: build the BlobFront image once in GitHub Actions (free), push it to
# GitHub Container Registry (GHCR), then have the VM *pull* it instead of
# compiling a custom Caddy binary on the box.
#
# Why: `xcaddy build` is a Go compile. Running it on the VM (the old
# `docker compose up --build`) needs ~1GB RAM and CPU, which is what forced a
# larger/more expensive VM. Building in CI lets the VM just pull a ready image,
# so it can run on the smallest/cheapest SKU.
#
# Required GitHub Actions secrets (Settings -> Secrets -> Actions):
#   VM_HOST       - Public IP of your BlobFront VM
#   VM_USER       - SSH username (default: blobfront)
#   VM_SSH_KEY    - Private SSH key for the VM
#
# One-time setup so the VM can pull without credentials:
#   After the first successful build, open the package at
#   https://github.com/users/<owner>/packages/container/blobfront/settings
#   and set its visibility to Public. (Or, to keep it private, add a
#   `docker login ghcr.io` step to the deploy script using a read-only PAT.)

name: Build and Deploy BlobFront

on:
  push:
    branches: [main]
    paths:
      - "config.yaml"
      - "Dockerfile"
      - "scripts/**"
      - "docker-compose.yml"
      - ".github/workflows/deploy.yml"

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Pull new image and restart on the VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd /opt/blobfront
            git pull origin main          # pick up config.yaml / compose changes
            docker compose pull            # fetch the freshly built image (no local build)
            docker compose up -d
            docker image prune -f          # reclaim disk from old image layers
